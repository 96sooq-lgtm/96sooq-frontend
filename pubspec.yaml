name: _96_sooq
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  pinput: ^6.0.1
  device_preview: ^1.3.1
  flutter_bloc: ^8.1.3
  shared_preferences: ^2.5.4
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^2.0.1
  animated_bottom_navigation_bar: ^1.4.0
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  translator: ^1.0.3+1
  url_launcher: ^6.3.2
  equatable: ^2.0.8
  app_links: ^6.4.1
  intl: ^0.20.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Black.ttf
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
        - asset: assets/fonts/amiri/Amiri-BoldItalic.ttf
        - asset: assets/fonts/amiri/Amiri-Italic.ttf
        - asset: assets/fonts/amiri/Amiri-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_ios: "assets/images/app_icon.png"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_background: "#000000"
  remove_alpha_ios: true
